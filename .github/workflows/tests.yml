name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast path: Home Assistant is stubbed in tests/conftest.py, so this proves
  # the suite stays runnable without installing HA at all.
  pytest:
    name: stubbed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  # Slow path: the same suite against the real Home Assistant release. The
  # stubs only make imports succeed - they cannot catch a signature that has
  # drifted from the real API, which is exactly what this job is for.
  pytest-homeassistant:
    name: real Home Assistant (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum declared in hacs.json. It runs on Python 3.13, and
          # pycares 5 (pulled in unpinned) breaks its aiodns at import time.
          - homeassistant: "2025.8.0"
            python-version: "3.13"
            extra: "pycares<5"
          - homeassistant: "latest"
            python-version: "3.14"
            extra: ""
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Home Assistant and test dependencies
        # mutagen and ha-ffmpeg are requirements of HA's own tts/ffmpeg
        # components, which the base homeassistant package does not pull in.
        # extra goes through env: inlined, bash parsed "pycares<5" as a redirect.
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          pip install -r requirements_test.txt
          if [ "${{ matrix.homeassistant }}" = "latest" ]; then ha=homeassistant; else ha="homeassistant==${{ matrix.homeassistant }}"; fi
          pip install "$ha" mutagen ha-ffmpeg $EXTRA
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - name: Run tests
        run: python -m pytest tests/ -v
